<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Pagina niet gevonden · Villa 235</title>
    <link rel="icon" type="image/png" href="/images/logo-villa235.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --limestone: #f5f1e8;
        --ink: #3b2a22;
        --ink-soft: #6a5648;
        --pine: #1f3b2e;
        --pine-deep: #16291f;
        --clay: #c56a4a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--limestone);
        color: var(--ink);
        font-family: "Hanken Grotesk", system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .wrap { max-width: 32rem; }
      .eyebrow {
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--clay);
        margin-bottom: 1.5rem;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 400;
        font-size: clamp(2.4rem, 8vw, 3.6rem);
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin-bottom: 1rem;
      }
      h1 em { font-style: italic; font-weight: 500; color: var(--clay); }
      p {
        font-size: 1.05rem;
        color: var(--ink-soft);
        margin-bottom: 2.25rem;
      }
      .btn {
        display: inline-block;
        background: var(--pine);
        color: var(--limestone);
        text-decoration: none;
        font-weight: 600;
        padding: 15px 28px;
        border-radius: 100px;
        transition: background 0.3s, transform 0.3s;
      }
      .btn:hover { background: var(--pine-deep); transform: translateY(-2px); }
      .sub {
        margin-top: 2rem;
        font-size: 0.85rem;
        color: var(--ink-soft);
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="eyebrow">Villa 235</p>
      <h1>Deze pagina is <em>onvindbaar</em></h1>
      <p>De pagina die u zocht bestaat niet of is verplaatst.</p>
      <a class="btn" href="/">Terug naar de villa</a>
      <p class="sub">Page not found · Page introuvable</p>
    </main>
  </body>
</html>
